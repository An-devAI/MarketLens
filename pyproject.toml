[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "marketlens"
version = "0.1.0.dev0"
description = "Evidence-linked company research and comparison"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["INTRODUCTION.md"]
dependencies = ["pydantic>=2.10,<3", "python-dotenv>=1,<2"]
[project.optional-dependencies]
research = ["langgraph>=0.5,<2", "transformers>=4.51,<5", "torch>=2.4", "sentence-transformers>=3,<6", "faiss-cpu>=1.8", "tavily-python>=0.5,<1", "httpx>=0.27,<1", "trafilatura>=2,<3"]
validation = ["langgraph>=0.5,<2", "faiss-cpu>=1.8"]
viewer = ["streamlit>=1.40,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9", "mypy>=1.13", "commitizen>=4,<5", "build>=1.2"]
[project.scripts]
marketlens = "marketlens.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0.dev0"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
